name: Check destroy workflow

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check shell syntax and teardown behavior without Azure
        shell: bash
        run: |
          bash -n scripts/*.sh
          python3 -m unittest discover -s tests -v
      - name: Set up pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Check Terraform without the remote backend
        shell: bash
        working-directory: environments/development
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
