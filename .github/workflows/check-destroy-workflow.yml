name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database-baseline:
    name: Database harness native positive control
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Checkout the D5 Payments source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: MichalBoczula/ECommerceStorePayments
          ref: 9663df14cb10886a32fa7850d1ca51537a3da009
          path: artifacts/database-gate/payments
          persist-credentials: false
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.100
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install the Payments lockfile's uv version
        run: python -m pip install uv==0.12.18
      - name: Check SQL and native Mongo driver contracts
        shell: bash
        run: bash scripts/run-database-baseline.sh

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check release inventory, shell syntax and teardown without Azure
        shell: bash
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/check-development-release.py
          python3 -m unittest discover -s tests -v
      - name: Set up pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Validate Terraform and produce offline review plans
        shell: bash
        run: bash scripts/check-terraform.sh

  windows:
    name: Windows Terraform compatibility
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Check Windows provider checksums and mock plans
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/probe-database-candidate.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'D6 PowerShell syntax validation failed.' }
          terraform "-chdir=environments/development" init -backend=false -input=false -lockfile=readonly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          terraform "-chdir=environments/development" validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          terraform "-chdir=environments/development" test "-test-directory=tests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
