name: Provision free database candidate
run-name: Database candidate ${{ inputs.action }} requested by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Review only or review and apply a fresh saved plan
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: terraform-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: development
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ACTION: ${{ inputs.action }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TF_VAR_enable_livedocs: ${{ vars.LIVEDOCS_ENABLED || 'false' }}
      TF_VAR_enable_database_candidate: ${{ vars.DATABASE_CANDIDATE_ENABLED || 'false' }}
      TF_VAR_candidate_suffix: ${{ vars.DATABASE_CANDIDATE_SUFFIX || 'unconfigured' }}
      TF_VAR_candidate_sql_password: ${{ secrets.DATABASE_CANDIDATE_SQL_PASSWORD }}
      TF_VAR_candidate_mongo_password: ${{ secrets.DATABASE_CANDIDATE_MONGO_PASSWORD }}
      LIVEDOCS_ARCHIVE_STORAGE_ACCOUNT: ${{ vars.LIVEDOCS_ARCHIVE_STORAGE_ACCOUNT }}
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Checkout the selected main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check development scope and D2 configuration
        shell: bash
        run: bash scripts/check-destroy-config.sh
      - name: Set up pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Sign in to Azure using OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Review and optionally provision the Free database candidate
        shell: bash
        run: bash scripts/deploy-database-candidate.sh
