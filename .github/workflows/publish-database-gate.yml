name: Publish D9 verification image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-gate-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout Infrastructure main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Checkout pinned Payments source and tests
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: MichalBoczula/ECommerceStorePayments
          ref: 9663df14cb10886a32fa7850d1ca51537a3da009
          path: artifacts/database-gate/payments
          persist-credentials: false
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.100
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install locked uv
        run: python -m pip install uv==0.12.18
      - name: Native control and exact image test before publication
        run: bash scripts/run-database-baseline.sh
      - name: Publish verified image only
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DOCKERHUB_USERNAME" == mb0101 && -n "$DOCKERHUB_TOKEN" ]] || { echo 'Configure Docker Hub publication secrets for mb0101'; exit 1; }
          image="mb0101/ecommerce-store-database-gate:d9-${GITHUB_SHA}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          docker tag ecommerce-d9-gate:tested "$image"
          docker push "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          [[ "$digest" =~ ^mb0101/ecommerce-store-database-gate@sha256:[a-f0-9]{64}$ ]]
          printf 'D/9 verified image: `%s`\nSource: `%s`\n' "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          # Publication has no Azure credentials and cannot start or recreate infrastructure.
